<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Usia</title>
</head>
<body>

    <label for="tanggalLahir">Tanggal lahir kamu:</label>
    <input type="date" id="tanggalLahir">

    <p id="hasilUsia"></p>

    <script>
        const inputTanggal = document.getElementById("tanggalLahir");
        const hasilUsia = document.getElementById("hasilUsia");

        inputTanggal.addEventListener("input", function () {
            const tanggal = inputTanggal.value;

            if (!tanggal) {
                hasilUsia.textContent = "";
                return;
            }

            const lahir = new Date(tanggal + "T00:00:00");
            const sekarang = new Date();

            // Mengosongkan hasil jika tanggal tidak valid
            // atau tanggal lahir berada di masa depan.
            if (
                isNaN(lahir.getTime()) ||
                lahir > sekarang
            ) {
                hasilUsia.textContent =
                    "Masukkan tanggal lahir yang valid.";
                return;
            }

            let tahun = sekarang.getFullYear() - lahir.getFullYear();
            let bulan = sekarang.getMonth() - lahir.getMonth();
            let hari = sekarang.getDate() - lahir.getDate();

            if (hari < 0) {
                bulan--;

                const hariBulanSebelumnya = new Date(
                    sekarang.getFullYear(),
                    sekarang.getMonth(),
                    0
                ).getDate();

                hari += hariBulanSebelumnya;
            }

            if (bulan < 0) {
                tahun--;
                bulan += 12;
            }

            hasilUsia.textContent =
                `Kamu sudah berusia ${tahun} tahun ${bulan} bulan ${hari} hari.`;
        });
    </script>

</body>
</html>
