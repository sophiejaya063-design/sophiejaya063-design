<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Aritmatika</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .calculator-card {
      width: 100%;
      max-width: 500px;
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      background-color: #ffffff;
    }
    .card-header-custom {
      background-color: #0d6efd;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }
    .result-box {
      background-color: #212529;
      color: white;
      border-radius: 6px;
      padding: 20px;
      text-align: center;
    }
    .result-title {
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-bottom: 5px;
      color: #dee2e6;
    }
    .result-value {
      font-size: 3rem;
      font-weight: bold;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <!-- Header -->
    <div class="card-header-custom">
      <h3 class="mb-2 fw-normal">Kalkulator Aritmatika</h3>
      <div class="d-inline-block px-2 py-1 bg-white text-primary rounded small">
        Sophie Isan Jaya - NIM. 262302019
      </div>
    </div>

    <!-- Body / Form -->
    <div class="card-body p-4">
      <form id="calcForm">
        <!-- Angka Pertama -->
        <div class="mb-3">
          <label for="angka1" class="form-label text-secondary fw-medium">Angka Pertama</label>
          <input type="number" class="form-control form-control-lg" id="angka1" value="3" required>
        </div>

        <!-- Angka Kedua -->
        <div class="mb-3">
          <label for="angka2" class="form-label text-secondary fw-medium">Angka Kedua</label>
          <input type="number" class="form-control form-control-lg" id="angka2" value="5" required>
        </div>

        <!-- Pilih Operator -->
        <div class="mb-4">
          <label for="operator" class="form-label text-secondary fw-medium">Pilih Operator</label>
          <select class="form-select form-select-lg" id="operator">
            <option value="+">Tambah (+)</option>
            <option value="-">Kurang (-)</option>
            <option value="*">Kali (*)</option>
            <option value="/">Bagi (/)</option>
            <option value="**" selected>Pangkat (**)</option>
            <option value="%">Modulus (%)</option>
          </select>
        </div>

        <!-- Tombol Hitung -->
        <div class="d-grid mb-4">
          <button type="submit" class="btn btn-primary btn-lg">Hitung</button>
        </div>
      </form>

      <!-- Hasil Perhitungan -->
      <div class="result-box">
        <div class="result-title">HASIL PERHITUNGAN</div>
        <div class="result-value" id="hasil">0</div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script Logika Kalkulator -->
  <script>
    document.getElementById('calcForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const num1 = parseFloat(document.getElementById('angka1').value);
      const num2 = parseFloat(document.getElementById('angka2').value);
      const op = document.getElementById('operator').value;
      const resultElement = document.getElementById('hasil');

      if (isNaN(num1) || isNaN(num2)) {
        resultElement.innerText = "Error";
        return;
      }

      let result = 0;

      switch(op) {
        case '+':
          result = num1 + num2;
          break;
        case '-':
          result = num1 - num2;
          break;
        case '*':
          result = num1 * num2;
          break;
        case '/':
          result = num2 !== 0 ? num1 / num2 : 'Error (Div/0)';
          break;
        case '**':
          result = Math.pow(num1, num2); // atau num1 ** num2
          break;
        case '%':
          result = num1 % num2;
          break;
        default:
          result = 0;
      }

      resultElement.innerText = result;
    });
  </script>
</body>
</html>
