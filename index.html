<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil & Kalkulator Saintifik</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 40px 20px;
            color: #333;
        }

        /* Navigasi Atas */
        .top-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .top-nav a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
        }

        .top-nav a:hover {
            text-decoration: underline;
        }

        /* Container Kartu Profil */
        .profile-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            background-color: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .profile-name {
            font-size: 22px;
            font-weight: bold;
            color: #212529;
            margin-bottom: 4px;
        }

        .profile-sub {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 20px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: #e0e0e0;
            margin-bottom: 20px;
        }

        .info-group {
            width: 100%;
            margin-bottom: 14px;
            text-align: left;
        }

        .info-label {
            font-size: 11px;
            color: #6c757d;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 13px;
            font-weight: 600;
            color: #212529;
        }

        .badge-active {
            background-color: #0d6efd;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 4px;
            margin-top: 10px;
        }

        /* Container Kalkulator Saintifik */
        .calc-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .calc-header {
            background-color: #0d6efd;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .calc-header h2 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .calc-header-badge {
            background-color: rgba(255, 255, 255, 0.9);
            color: #0d6efd;
            display: inline-block;
            padding: 4px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .calc-body {
            padding: 20px;
        }

        /* Screen Display */
        .display-screen {
            background-color: #212529;
            color: white;
            border-radius: 8px;
            padding: 15px 20px;
            text-align: right;
            margin-bottom: 20px;
        }

        .expression-display {
            font-size: 14px;
            color: #adb5bd;
            min-height: 20px;
            word-wrap: break-word;
        }

        .result-display {
            font-size: 32px;
            font-weight: bold;
            min-height: 40px;
            word-wrap: break-word;
        }

        /* Grid Tombol */
        .keypad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .btn-calc {
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 12px 0;
            font-size: 14px;
            font-weight: 600;
            color: #212529;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .btn-calc:hover {
            background-color: #e9ecef;
        }

        .btn-calc:active {
            transform: scale(0.96);
        }

        .btn-func {
            background-color: #e7f5ff;
            color: #1971c2;
            border-color: #a5d8ff;
        }

        .btn-func:hover {
            background-color: #d0ebff;
        }

        .btn-action {
            background-color: #ffe3e3;
            color: #e03131;
            border-color: #ffc9c9;
        }

        .btn-action:hover {
            background-color: #ffc9c9;
        }

        .btn-equal {
            background-color: #0d6efd;
            color: white;
            border-color: #0d6efd;
            grid-column: span 2;
        }

        .btn-equal:hover {
            background-color: #0b5ed7;
        }

        /* Footer */
        footer {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Navigasi Atas -->
    <div class="top-nav">
        <a href="lat41.html">Latihan P4-1 </a>
        <a href="lat42.html">Latihan P4-2 </a>
        <a href="lat43.html">Latihan P4-3 </a>
        <a href="lat44.html">Latihan P4-4 </a>
    </div>

    <!-- Kartu Profil -->
    <div class="profile-card">
        <div class="avatar">S</div>
        <div class="profile-name">Sophie Isan Jaya</div>
        <div class="profile-sub">Mahasiswa Semester 1</div>
        <div class="divider"></div>
        
        <div class="info-group">
            <div class="info-label">Nama Lengkap</div>
            <div class="info-value">Sophie Isan Jaya</div>
        </div>
        
        <div class="info-group">
            <div class="info-label">NIM</div>
            <div class="info-value">2623020019</div>
        </div>
        
        <div class="info-group">
            <div class="info-label">Program Studi</div>
            <div class="info-value">Komputerisasi Akuntansi</div>
        </div>
        
        <div class="info-group">
            <div class="info-label">Semester</div>
            <div class="info-value">1</div>
        </div>
        
        <div class="badge-active">Mahasiswa Aktif</div>
    </div>

    <!-- Kalkulator Saintifik -->
    <div class="calc-card">
        <div class="calc-header">
            <h2>Kalkulator Saintifik</h2>
            <div class="calc-header-badge">Sophie Isan Jaya - NIM. 2623020019</div>
        </div>
        <div class="calc-body">
            <!-- Layar Hasil -->
            <div class="display-screen">
                <div class="expression-display" id="expression"></div>
                <div class="result-display" id="result">0</div>
            </div>

            <!-- Tombol-tombol Saintifik -->
            <div class="keypad">
                <button class="btn-calc btn-func" onclick="appendFunc('sin(')">sin</button>
                <button class="btn-calc btn-func" onclick="appendFunc('cos(')">cos</button>
                <button class="btn-calc btn-func" onclick="appendFunc('tan(')">tan</button>
                <button class="btn-calc btn-action" onclick="clearAll()">AC</button>
                <button class="btn-calc btn-action" onclick="deleteChar()">DEL</button>

                <button class="btn-calc btn-func" onclick="appendFunc('log(')">log</button>
                <button class="btn-calc btn-func" onclick="appendFunc('ln(')">ln</button>
                <button class="btn-calc btn-func" onclick="appendValue('(')">(</button>
                <button class="btn-calc btn-func" onclick="appendValue(')')">)</button>
                <button class="btn-calc btn-func" onclick="appendValue('^')">x^y</button>

                <button class="btn-calc btn-func" onclick="appendFunc('sqrt(')">√</button>
                <button class="btn-calc" onclick="appendValue('7')">7</button>
                <button class="btn-calc" onclick="appendValue('8')">8</button>
                <button class="btn-calc" onclick="appendValue('9')">9</button>
                <button class="btn-calc btn-func" onclick="appendValue('/')">÷</button>

                <button class="btn-calc btn-func" onclick="appendValue('!')">n!</button>
                <button class="btn-calc" onclick="appendValue('4')">4</button>
                <button class="btn-calc" onclick="appendValue('5')">5</button>
                <button class="btn-calc" onclick="appendValue('6')">6</button>
                <button class="btn-calc btn-func" onclick="appendValue('*')">×</button>

                <button class="btn-calc btn-func" onclick="appendValue('π')">π</button>
                <button class="btn-calc" onclick="appendValue('1')">1</button>
                <button class="btn-calc" onclick="appendValue('2')">2</button>
                <button class="btn-calc" onclick="appendValue('3')">3</button>
                <button class="btn-calc btn-func" onclick="appendValue('-')">-</button>

                <button class="btn-calc btn-func" onclick="appendValue('e')">e</button>
                <button class="btn-calc" onclick="appendValue('0')">0</button>
                <button class="btn-calc" onclick="appendValue('.')">.</button>
                <button class="btn-calc btn-func" onclick="appendValue('+')">+</button>
                <button class="btn-calc btn-func" onclick="appendValue('%')">%</button>

                <button class="btn-calc btn-equal" onclick="calculateResult()">=</button>
            </div>
        </div>
    </div>

    <footer>
        © 2026 Sophie Isan Jaya
    </footer>

    <script>
        const expressionEl = document.getElementById('expression');
        const resultEl = document.getElementById('result');
        let currentExpr = '';

        function appendValue(val) {
            currentExpr += val;
            updateDisplay();
        }

        function appendFunc(funcName) {
            currentExpr += funcName;
            updateDisplay();
        }

        function clearAll() {
            currentExpr = '';
            resultEl.innerText = '0';
            expressionEl.innerText = '';
        }

        function deleteChar() {
            currentExpr = currentExpr.slice(0, -1);
            updateDisplay();
        }

        function updateDisplay() {
            expressionEl.innerText = currentExpr;
        }

        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) result *= i;
            return result;
        }

        function calculateResult() {
            if (!currentExpr) return;
            try {
                let parsed = currentExpr
                    .replace(/π/g, 'Math.PI')
                    .replace(/e/g, 'Math.E')
                    .replace(/sqrt\(/g, 'Math.sqrt(')
                    .replace(/sin\(/g, 'Math.sin(')
                    .replace(/cos\(/g, 'Math.cos(')
                    .replace(/tan\(/g, 'Math.tan(')
                    .replace(/log\(/g, 'Math.log10(')
                    .replace(/ln\(/g, 'Math.log(')
                    .replace(/\^/g, '**');

                parsed = parsed.replace(/(\d+)!/g, (match, number) => factorial(parseInt(number)));

                let res = eval(parsed);
                if (typeof res === 'number') {
                    res = Number.isInteger(res) ? res : parseFloat(res.toFixed(8));
                }
                resultEl.innerText = res;
            } catch (error) {
                resultEl.innerText = 'Error';
            }
        }
    </script>
</body>
</html>
